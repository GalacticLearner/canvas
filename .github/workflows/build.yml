# Native builders produce offline binaries and preserve test evidence on each target OS.
name: Native builds
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package:server
      - run: npm run package:client
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Canvas-${{ matrix.os }}
          path: |
            dist/executables/*
            dist/installers/*.exe
            dist/installers/*.AppImage
            dist/installers/*.dmg
